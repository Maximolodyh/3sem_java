spring.application.name=java-lab-8
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/students;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
management.endpoints.web.exposure.include=health,info,metrics,mappings
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=Java Lab 8
info.app.description=Students and study groups
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
