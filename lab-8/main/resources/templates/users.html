<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пользователи</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="container"><a th:href="@{/students}">← К студентам</a><h1>Пользователи</h1><div class="table-wrap"><table><thead><tr><th>Имя</th><th>Email</th><th>Активен</th><th>Роли</th></tr></thead><tbody><tr th:each="u:${users}"><td th:text="${u.firstName+' '+u.lastName}"></td><td th:text="${u.email}"></td><td th:text="${u.active ? 'да' : 'нет'}"></td><td><span th:each="r:${u.roles}" th:text="${r.name+' '}"></span></td></tr></tbody></table></div></main></body></html>
