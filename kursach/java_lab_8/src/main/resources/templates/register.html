<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Регистрация</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="container narrow"><a th:href="@{/}">← На главную</a><h1>Регистрация</h1><p>Новая учётная запись получает только роль READ_ONLY (просмотр данных). Для редактирования администратор может выдать роль USER.</p><form class="card" th:action="@{/register}" th:object="${registrationForm}" method="post"><label>Имя<input th:field="*{firstName}" maxlength="40"><small class="error" th:errors="*{firstName}"></small></label><label>Фамилия<input th:field="*{lastName}" maxlength="40"><small class="error" th:errors="*{lastName}"></small></label><label>Email<input type="email" th:field="*{email}" maxlength="120"><small class="error" th:errors="*{email}"></small></label><label>Пароль<input type="password" th:field="*{password}" minlength="8" maxlength="72" autocomplete="new-password"><small class="error" th:errors="*{password}"></small></label><button class="button" type="submit">Зарегистрироваться</button></form></main></body></html>
