<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стоимость книг — Книжный каталог</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="container"><div th:replace="~{fragments :: nav}"></div>

<header><div><h1>Стоимость книг</h1><p>Одна книга может продаваться в разных магазинах по разной цене</p></div>
<a class="button" sec:authorize="hasAnyRole('USER','ADMIN')" th:href="@{/prices/new}">Указать цену</a></header>
<p class="alert" th:if="${error}" th:text="${error}"></p>
<div class="table-wrap"><table><thead><tr><th>Книга</th><th>Магазин</th><th>Цена, ₽</th><th sec:authorize="hasAnyRole('USER','ADMIN')">Действия</th></tr></thead>
<tbody><tr th:each="p: ${prices}"><td th:text="${p.book.title}"></td><td th:text="${p.store.name}"></td><td th:text="${p.price}"></td>
<td sec:authorize="hasAnyRole('USER','ADMIN')" class="actions"><a th:href="@{/prices/{id}/edit(id=${p.id})}">Изменить</a>
<form th:action="@{/prices/{id}/delete(id=${p.id})}" method="post"><button class="link danger" type="submit">Удалить</button></form></td></tr>
<tr th:if="${#lists.isEmpty(prices)}"><td colspan="4">Сначала создайте книгу, магазин и цену.</td></tr></tbody></table></div>

</main></body></html>
