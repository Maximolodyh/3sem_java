<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="container narrow"><a th:href="@{/}">← На главную</a><h1>Вход</h1><p class="alert" th:if="${param.error}">Неверный email или пароль</p><p th:if="${param.registered}">Регистрация завершена. Теперь войдите.</p><form class="card" th:action="@{/login}" method="post"><label>Email<input type="email" name="username" autocomplete="username" required></label><label>Пароль<input type="password" name="password" autocomplete="current-password" required></label><button class="button" type="submit">Войти</button><a th:href="@{/register}">Создать аккаунт</a></form></main></body></html>
