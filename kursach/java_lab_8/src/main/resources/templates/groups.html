<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Группы</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="container"><nav><strong>Учебный портал</strong><a th:href="@{/students}">Студенты</a><a th:href="@{/groups}">Группы</a><form th:action="@{/logout}" method="post"><button class="link danger" type="submit">Выйти</button></form></nav>
<header><div><h1>Учебные группы</h1><p>Непустую группу удалить нельзя</p></div><a sec:authorize="hasAnyRole('EDITOR','ADMIN')" class="button" th:href="@{/groups/new}">Добавить</a></header><p class="alert" th:if="${error}" th:text="${error}"></p>
<div class="table-wrap"><table><thead><tr><th>Код</th><th>Название</th><th>Студентов</th><th>Действия</th></tr></thead><tbody><tr th:each="g:${groups}"><td th:text="${g.code}"></td><td th:text="${g.title}"></td><td th:text="${g.studentCount}"></td><td><a sec:authorize="hasAnyRole('EDITOR','ADMIN')" th:href="@{/groups/{id}/edit(id=${g.id})}">Изменить</a> <form sec:authorize="hasRole('ADMIN')" th:action="@{/groups/{id}/delete(id=${g.id})}" method="post"><button class="link danger" type="submit">Удалить</button></form></td></tr></tbody></table></div>
</main></body></html>
