<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Студенты</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="container"><nav><strong>Учебный портал</strong><a th:href="@{/students}">Студенты</a><a th:href="@{/groups}">Группы</a></nav><header><div><h1>Студенты</h1><p>Управление списком студентов</p></div><a class="button" th:href="@{/students/new}">Добавить</a></header><div class="table-wrap"><table><thead><tr><th>Имя</th><th>Фамилия</th><th>Факультет</th><th>Возраст</th><th>Группа</th><th>Действия</th></tr></thead><tbody><tr th:each="s:${students}"><td th:text="${s.name}"></td><td th:text="${s.surname}"></td><td th:text="${s.faculty}"></td><td th:text="${s.age}"></td><td th:text="${s.groupCode ?: '—'}"></td><td class="actions"><a th:href="@{/students/{id}/edit(id=${s.id})}">Изменить</a><form th:action="@{/students/{id}/delete(id=${s.id})}" method="post"><button class="link danger" type="submit">Удалить</button></form></td></tr><tr th:if="${#lists.isEmpty(students)}"><td colspan="6">Записей пока нет</td></tr></tbody></table></div></main></body></html>
