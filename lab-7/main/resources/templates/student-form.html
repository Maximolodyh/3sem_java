<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Студент</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="container narrow"><a th:href="@{/students}">← К списку</a><h1>Данные студента</h1><form class="card" th:action="${action}" th:object="${studentForm}" method="post"><label>Имя<input th:field="*{name}" maxlength="15"><small class="error" th:errors="*{name}"></small></label><label>Фамилия<input th:field="*{surname}" maxlength="25"><small class="error" th:errors="*{surname}"></small></label><label>Факультет<input th:field="*{faculty}" maxlength="20"><small class="error" th:errors="*{faculty}"></small></label><label>Возраст<input type="number" th:field="*{age}" min="14" max="120"><small class="error" th:errors="*{age}"></small></label><label>Группа<select th:field="*{groupId}"><option value="">Без группы</option><option th:each="g:${groups}" th:value="${g.id}" th:text="${g.code+' — '+g.title}"></option></select><small class="error" th:errors="*{groupId}"></small></label><button class="button" type="submit">Сохранить</button></form></main></body></html>
